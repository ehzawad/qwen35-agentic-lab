# Multifaceted agentic training path: every count, budget, and gate in one place.
#
# This file is the single source of truth for the training mixture, acceptance
# quotas, view weighting, prompt-control design, variance-probe gates, and GRPO
# settings. Modules read it via agentlab.suite.configio.load_config(); the task
# families, horizons and per-cell sizes come from configs/suite_v1.toml, which is
# the size authority for the committed suite data.
#
# After the Preregister phase commits docs/AGENTIC_PROTOCOL.md and
# configs/agentic_preregister.json, the gate thresholds herein are FROZEN: a
# genuinely broken gate gets a dated AMENDMENT section plus fresh held-out
# seeds, never an in-place edit.
#
# TAXONOMY RECONCILIATION (2026-08-05). An earlier parallel build wrote this
# file against a four-family framing (compositional / lookup_chain / recovery /
# stateful) that does not exist anywhere else in the project: docs/
# AGENTIC_PROTOCOL.md, configs/agentic_preregister.json, configs/suite_v1.toml
# and src/agentlab/suite/ all use the binding three families with twelve
# family/horizon cells. The keys below were re-pointed at that taxonomy. Every
# GATE THRESHOLD kept its exact value; `recovery` became a CONDITION on all
# three families rather than a family, so its acceptance minimum survives as
# `min_accepted_faulted`. Counts that had to move (dev-split subsample sizes,
# rollout totals) are annotated inline with the reason.

version: 1
seed_salt: multifaceted-v1

model:
  base: Qwen/Qwen3.5-4B

# ---------------------------------------------------------------------------
# HARDWARE (2026-08-05 pivot). This is a SINGLE-CARD NVIDIA RTX A5000 study.
# The RTX A6000 is released completely: it is not waited for, not reserved, not
# probed, and no opportunistic branch runs on it. A future A6000 experiment is a
# separate registered run with its own locks, seeds, ledger and declaration.
#
# `cuda_visible_bytes` is the MEASURED torch total_memory of the pinned card,
# not the board total nvidia-smi prints (25,757,220,864 B / 24,564 MiB): the
# driver reserve is the difference. S19 HARDWARE-INTEGRITY compares the measured
# value, so the two must not be confused.
# ---------------------------------------------------------------------------
hardware:
  registered_gpu: A5000                 # EXPECT_GPU substring, effectively mandatory
  expected_name: NVIDIA RTX A5000
  gpu_count: 1
  cuda_device_order: PCI_BUS_ID
  cuda_visible_devices: "0"
  cuda_visible_bytes: 25282805760       # 23.546 GiB, measured
  # Exclusivity preflight. The card exposes 24,111 MiB CUDA-visible of a 24,564
  # MiB board, so this is the ~24,000-MiB-class guard the A5000 pivot registered
  # (it replaced a 45,056 MiB guard written for a 48 GB card, which no A5000 can
  # ever satisfy). The margin below 24,000 is the driver's own few hundred MiB,
  # NOT room for a co-tenant: anything larger than that gap fails the check.
  min_free_mib: 23500
  lock: results/agentic/hardware.json   # first GPU stage binds the UUID here

# ---------------------------------------------------------------------------
# THE REGISTERED ENGINE CONTRACT for every inference stage. ONE copy: every
# stage reads it through agentlab.suite.configio.engine_contract(), scripts/
# serve.sh reads the same keys, and configs/agentic_preregister.json
# machine.engine_contract carries the analyzer's copy (tests cross-check them).
#
# Chosen from the live A5000 probe BEFORE any study GPU-hour: at 0.85 the engine
# measured 19.857 GiB used / 3.69 GiB free with a 9.08 GiB (242,741-token) KV
# cache and a 10.777 GiB non-KV footprint. 0.80 gives an estimated 7.90 GiB /
# ~211k-token cache -- still 3.2x the 65,536 tokens eight full 8,192-token
# requests can occupy -- and holds ~4.2 GiB of real slack. Deliberately NOT
# compensated upward to 0.8725.
# ---------------------------------------------------------------------------
engine:
  dtype: bfloat16
  gpu_memory_utilization: 0.80
  max_model_len: 8192
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  enforce_eager: false
  enable_thinking: false                # this checkpoint defaults thinking ON
  multimodal_inputs: REJECTED           # refused, not merely unused
  tensor_parallel_size: 1
  # MEASURED operational facts, used for the startup ledger, never as thresholds.
  measured:
    startup_s: 289.7
    greedy_48_token_generation_s: 1.08
    probe_gpu_memory_utilization: 0.85
    probe_kv_cache_gib: 9.08
    probe_kv_cache_tokens: 242741
    probe_non_kv_footprint_gib: 10.777

budget:
  # 120 measured GPU-hours: the forecaster's minimum defensible pre-calibration
  # budget for the MANDATORY census below. The old 36 h was set before the
  # mandatory BP/TP evaluation was costed from measured evaluator rates (25.10
  # s/episode base, 44.27 s/episode trained over 7,800 mandatory episodes
  # projects 75-99 h), so 36 h would have silently forced mandatory-sample
  # shrinkage -- which is forbidden. This is an accounting envelope, not a
  # decision threshold. The concurrent-vLLM evaluator may finish the whole
  # programme in ~14-21 h; that is an EXPECTATION, never a registered
  # measurement. If a post-calibration projection exceeds the ceiling, cut
  # optional arms in the frozen order; if MANDATORY work still does not fit,
  # STOP and report INCOMPLETE / INCONCLUSIVE.
  gpu_hours_ceiling: 120
  ledger: results/agentic/gpu_ledger.jsonl
  # Engine startup is a real budget line, not overhead to be hand-waved: at the
  # measured 289.7 s a cold start costs 0.08047 GPU-hours. The pre-pivot chain
  # paid 85 of them (6.840 h; 50 rejection-sampling shards alone were 4.02 h and
  # 10 tournament processes 0.80 h). The persistent-engine restructure pays ONE
  # per stage -- 6 starts, 0.483 h -- saving 6.357 h.
  engine_starts:
    registered: 6
    pre_pivot: 85
    hours_each: 0.08047
    hours_registered: 0.483
    hours_pre_pivot: 6.840
    hours_saved: 6.357
  # Calibrated estimates (hours) from the council design report, not measurements.
  stage_estimates_h:
    prompt_tournament: [0.8, 1.2]
    production_rs: [3.5, 5.0]
    rs_sft: [3.0, 4.5]
    sft_gate: [0.4, 0.8]
    variance_probe: [0.8, 1.4]
    grpo: [4.0, 6.0]
    final_eval: [2.5, 4.0]

# Sampling for rejection sampling, the prompt tournament and the variance probe.
decoding:
  temperature: 0.8
  top_p: 0.95
  top_k: 20
  enable_thinking: false
  max_tokens_per_decision: 384

# Deterministic decoding for every preregistered CLAIM (the evaluation arms and
# the shipping smoke). These are the frozen values in
# configs/agentic_preregister.json `decoding:`; the evaluator reads them here.
eval_decoding:
  temperature: 0.0
  top_p: 1.0
  seed: 2786983945                      # 0xA61E0009
  enable_thinking: false
  max_tokens_per_decision: 1024
  concurrency: 8                        # matches engine.max_num_seqs

scenario:
  fault_types: [transient, rate_limit, malformed, wrong_unit]
  # Episode budgets are NOT configured here. They are computed by
  # agentlab.suite.schema.decision_budget/call_budget (H+3 clean, H+5
  # single-fault, H+8 stress, calls capped at 2H+4), committed into every task
  # spec, and enforced by the verifier. A second copy in this file would be a
  # second source of truth; the earlier H+2/H+4 values here also contradicted
  # the frozen protocol document.
  #
  # Observation-size ceiling for one model-visible tool result. The council's
  # training-path section proposed "at most 64 tokens"; that was written for the
  # two stateless families and is contradicted by the binding env-architect
  # designs in the same report. MEASURED worst cases over the committed
  # generators with the Qwen3.5-4B tokenizer: lookup_chain 42, typed_relay 79,
  # fulfillment 188 (the H20 order query must list every line with its
  # capability token). The values below are the measured maxima rounded up and
  # act as a regression guard on the generators, not as a target.
  tool_output_max_tokens: 208
  tool_output_max_chars: 512      # the CPU-cheap proxy the acceptance filter uses

# ---------------------------------------------------------------------------
# Committed suite splits (generated by scripts/generate_suite.py). Sizes live in
# configs/suite_v1.toml; the names below say which split each stage consumes.
# ---------------------------------------------------------------------------
suite:
  config: configs/suite_v1.toml
  data_dir: data/suite/v1
  rs_source: distill            # 2,400 specs, 200 per cell, train templates 0-7
  oracle_source: oracle_sft     # 4,800 specs, 400 per cell, train templates 0-7
  grpo_pool: grpo_train         # 2,400 specs, 200 per cell, train templates 0-7
  dev: dev                      # 3,600 specs, 300 per cell, dev templates 8-9
  eval: eval                    # 1,200 specs, 100 per cell, eval templates 10-11
  stress: eval_stress           # 280 specs, 40 per cell at or above H8
  # The four claim/control splits the eval stage also consumes are listed in
  # `eval.manifests` below, so the work table and the split names have ONE
  # definition: eval_mt 600, eval_h8 200, eval_absent 600, eval_perm 100.

# ---------------------------------------------------------------------------
# Training mixture over the RS source split. H means causally necessary calls,
# not permission to call that many times. Rollouts per variant are split equally
# between the canonical system prompt and the best frozen prompt-control
# sentence (selected on the disjoint dev split, never here).
#
# `variants` mirrors configs/suite_v1.toml (200 specs per cell); k per horizon
# keeps the council's 4/6/8 ladder and extends it to the deep cells. Family
# `min_accepted` values are the council's originals re-pointed: typed_relay
# inherits compositional's 360, lookup_chain keeps 270, fulfillment inherits
# stateful's 240. The recovery family's 480 becomes min_accepted_faulted below,
# because injected faults are now a condition on all three families.
# ---------------------------------------------------------------------------
mixture:
  lookup_chain:
    variants: {h2: 200, h4: 200, h8: 200, h12: 200}
    k: {h2: 4, h4: 6, h8: 8, h12: 8}
    rollouts: 5200
    min_accepted: 270
  typed_relay:
    variants: {h2: 200, h4: 200, h8: 200, h12: 200}
    k: {h2: 4, h4: 6, h8: 8, h12: 8}
    rollouts: 5200
    min_accepted: 360
  fulfillment:
    variants: {h4: 200, h8: 200, h14: 200, h20: 200}
    k: {h4: 6, h8: 8, h14: 8, h20: 8}
    rollouts: 6000
    min_accepted: 240

totals:
  variants: 2400                  # 12 cells x 200, exactly the distill split
  rollouts: 16400                 # sum of variants x k (council estimate: 16,100)
  min_accepted: 1350              # 270 + 360 + 240 family floors + 480 faulted
  min_accepted_faulted: 480       # the former recovery-family floor, as a condition
  # Deep-horizon cells the council designated failure-envelope measurements.
  # They are generated, rolled out and reported, but they do not carry an
  # acceptance quota: a missing H14/H20 quota must never be backfilled from
  # easier cells, and calling zero accepted trajectories a quota failure would
  # hide the real finding.
  measured_only_cells: [fulfillment-h14, fulfillment-h20]

# ---------------------------------------------------------------------------
# Acceptance filters (enforcement lives in agentlab.multidistill; strict
# verifier success is a precondition for every one of them).
# ---------------------------------------------------------------------------
acceptance:
  per_variant_accepted: 1           # keep at most one trajectory per variant
  max_view_tokens: 4096             # reject-not-truncate at SFT view level
  numeric_tolerance: 1.0e-4
  call_upper_slack:                 # calls must satisfy H <= calls <= H + slack
    lookup_chain: 1
    typed_relay: 2                  # the former `compositional` slack
    fulfillment: 2                  # the former `stateful` slack
    faulted_extra: 1                # a faulted episode may spend one recovery
                                    # call on top: typed_relay 2+1 = the former
                                    # recovery slack of 3
  max_redundant_calls:              # redundant = exact duplicate of an earlier call
    lookup_chain: 1
    typed_relay: 1
    fulfillment: 1
  recovery:
    max_decisions_after_fault: 2    # first valid recovery within two assistant decisions
    max_identical_retries: 2

# ---------------------------------------------------------------------------
# Completion-only view construction (agentlab.suite.datasets).
# ---------------------------------------------------------------------------
views:
  terminal_copies: 2
  pivot_per_trajectory: 1
  pivot_per_trajectory_h8: 2
  recovery_copies: 2                # first post-fault decision, emitted twice
  recovery_two_decision_copies: 1   # two distinct decisions: each once, combined weight 2
  terminal_weight_min: 0.5          # corpus-level gate, checked at build time
  expected_rows: [5000, 6000]

# ---------------------------------------------------------------------------
# RS-SFT settings (consumed by the SFT stage; recorded here for one-source truth).
# ---------------------------------------------------------------------------
sft:
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05
  epochs: 1
  lr: 5.0e-5
  scheduler: cosine
  warmup_ratio: 0.03
  max_length: 4096
  bsz: 2
  accum: 8
  packing: false
  gradient_checkpointing: true
  # The A5000 training arithmetic. Static training memory is 8.455 GiB (bf16 base
  # policy) + 0.968 GiB (LoRA fp32 params, grads, two Adam moments) = 9.423 GiB.
  # One 4,096-token sequence of logits over this 248,320-token vocabulary is
  # ~2.03 GiB, so train batch 2 peaks around 13.5 GiB and gradient checkpointing
  # keeps the working peak near 14-15 GiB of 23.3 GiB.
  #
  # eval_bsz is load-bearing: Hugging Face defaults per_device_eval_batch_size to
  # 8, which is 8 x 2.03 = 16.24 GiB of logits on top of the 9.423 GiB static
  # footprint = 25.66 GiB. That CANNOT fit on this card, and it would fail during
  # the first evaluation rather than at start-up. At batch 1 the peak is ~11.45
  # GiB. prediction_loss_only stops the trainer from gathering logits at all.
  eval_bsz: 1
  eval_accumulation_steps: 1
  prediction_loss_only: true

# ---------------------------------------------------------------------------
# Elicitation control (agentlab.prompt_control).
#
# The candidate set is NOT configured here: it is the eight files in
# prompts/agentic/, hash-pinned in configs/agentic_preregister.json under
# prompt_candidates.sha256, with p1_minimal.txt as the neutral default. An
# earlier parallel build carried a second, unpreregistered control (eight
# one-sentence fragments in configs/prompt_candidates.json); it was removed, so
# the BP/TP arms use the prompt set the frozen gates actually describe.
#
# The sizes below are the preregistered ones (100 per axis for round 1, another
# 200 per axis for the top two), over the three CLAIM axes -- recovery,
# all-three-tools orchestration at H4, and clean H8 -- not per family.
#
# CONFLICT RESOLVED (2026-08-05) BY GENERATING THE REGISTERED SAMPLES, NOT BY
# SHRINKING THE TOURNAMENT. The dev split used to hold 20 specs per cell (240
# total) and could supply only recovery 240/300, orchestration 20/300
# (typed_relay-h4 only) and h8 40/300. Lowering `round1_per_axis` would have been
# a moved goalpost, so configs/suite_v1.toml raised dev to 300 per cell (3,600
# total) and the suite was regenerated. Realized axis pools, asserted by the
# generator and recorded in data/suite/v1/manifest.json `realized`: recovery
# 3,600, orchestration 300, h8 600, against the registered 300 each.
# `python -m agentlab.prompt_control axes` re-derives them, and prompt_control
# still refuses to run a smaller tournament under the preregistered name.
# ---------------------------------------------------------------------------
prompt_control:
  n_candidates: 8
  round1_per_axis: 100
  round2_per_axis: 200
  h8_feasibility_min: 0.05          # below this, H8 stratum is measured-only
  frozen_file: configs/frozen_prompt.json

sft_gate:
  # The post-SFT gate must not reuse tournament tasks. Its window starts after
  # every instance the tournament consumes.
  dev_per_cell: 10
  dev_offset_per_cell: 30

# ---------------------------------------------------------------------------
# GRPO grip probe (agentlab.variance): run after RS-SFT, before any GRPO.
# 48 disjoint groups per family (12 per cell) x 8 generations, drawn from the
# GRPO pool split and disjoint from the GRPO training pool.
# ---------------------------------------------------------------------------
variance_probe:
  source_split: grpo_train
  groups_per_family: 48
  groups_per_cell: 12
  generations_per_group: 8
  # STAGE DISPOSITION, not a gate state. GRPO cannot instantiate on the
  # registered card (see grpo.stage_disposition), so the probe -- whose only
  # purpose is to decide whether to spend GRPO hours -- is short-circuited before
  # it runs. It is therefore NOT_EVALUATED, never "closed": recording "closed"
  # would claim the complete 144-group / 1,152-rollout probe ran and that a
  # binding gate failed, which is evidence about the RS-SFT policy that this run
  # does not have. agentlab.variance refuses to run while this label stands.
  stage_disposition: NOT_EVALUATED_HARDWARE_SHORT_CIRCUIT
  # When the probe DOES run (a future registered study), it must run on the
  # locked RS-SFT adapter -- not the base model. That is the policy whose group
  # variance the GRPO decision is about.
  policy: rs_sft_adapter
  gates:
    min_nonzero_reward_sd_frac: 0.60
    min_terminal_disagreement_frac: 0.40
    mean_success_range: [0.15, 0.85]
    max_clip_frac: 0.05

# ---------------------------------------------------------------------------
# Selective env-mode GRPO. The settings below are the REGISTERED configuration
# whose infeasibility is the finding; there is deliberately NO `agentlab.multigrpo`
# module, because writing a trainer for a stage that cannot instantiate would
# invite someone to run a substituted variant under this branch's name. The GRPO
# branch is out of v1 scope by unanimous council ruling; these keys exist so the
# arithmetic below is checkable against something concrete rather than recalled.
#
# Had it run: map-style dataset only, rows carrying family/task_id/spec/kb/nodes
# so TRL's repeat sampler reconstructs the identical task for every group member;
# dataset-free random reset() forbidden; the training pool starting after the
# probe groups in each cell.
# ---------------------------------------------------------------------------
grpo:
  # NOT RUN. The registered colocate configuration cannot instantiate on the
  # registered A5000, so the stage's outcome is a DISPOSITION -- what happened to
  # the stage -- and never one of the gate states PASS/FAIL/INCONCLUSIVE/BUG.
  #
  # The arithmetic, all from the live probe:
  #   vllm_gpu_memory_utilization 0.24 x 23.54644775390625 GiB = 5.651 GiB carve
  #   vLLM's own colocated policy copy                         = 8.455 GiB
  #   => the carve is 2.804 GiB SMALLER than the copy it must hold.
  #   LoRA trainer static 9.420 GiB + that copy = 17.875 GiB of 23.334 GiB free
  #   before ANY KV cache, CUDA graphs, checkpointed activations, or the 1.53 GiB
  #   of bf16 logits every 3,072-token completion in the microbatch produces.
  #
  # `GRPO_NOT_RUN_HARDWARE_INFEASIBLE` is NOT interchangeable with
  # `GRPO_NOT_RUN_VARIANCE_GATE_CLOSED`, which would mean the full 144-group
  # probe ran and a binding gate failed. Microbatch 1, 2,048-token completions,
  # no-vLLM generation, quantization, offload and another card each define a
  # DIFFERENT treatment and may not be substituted under this branch.
  stage_disposition: GRPO_NOT_RUN_HARDWARE_INFEASIBLE
  disposition_artifact: results/agentic/grpo_disposition.json
  disposition_arithmetic:
    vllm_allocation_gib: 5.651
    vllm_policy_copy_gib: 8.455
    trainer_static_gib: 9.420
    combined_gib: 17.875
    card_free_gib: 23.334
    logits_gib_per_3072_token_sequence: 1.53
  source_split: grpo_train
  pool_offset_per_cell: 12          # skip the probe groups
  prompt_groups: 192
  num_generations: 8
  rollouts: 1536
  loss_type: dapo
  clip_epsilon: 0.2                 # pinned DAPO default, not overridden
  lr: 5.0e-7
  beta: 0.0
  bsz: 4
  accum: 2
  max_tool_calling_iterations: 10   # 8 required calls + 1 recovery + room to terminate
  max_completion_length: 3072
  vllm_max_model_length: 6144
  vllm_gpu_memory_utilization: 0.24
  mask_truncated_completions: false
  guards:
    clip:
      target: 0.05
      abort_threshold: 0.15         # rolling window mean that aborts the run
      window: 8
      warmup_steps: 16
    no_commit:
      abort_threshold: 0.20         # rollouts ending on a tool call, no committed turn
      window: 8
      warmup_steps: 16
    zero_variance_stop:
      window_steps: 32
      max_zero_frac: 0.70           # stop if >=70% of groups have zero terminal variance
    clip_retry:                     # preflight between 5% and 15%: retry, don't continue
      trigger_range: [0.05, 0.15]
      max_completion_length: 3584
      vllm_max_model_length: 7168
  reward:
    weights:
      terminal_success: 1.0
      verified_milestone_fraction: 0.20
      required_recovery_success: 0.10
      excess_calls: -0.02
      illegal_state_action: -0.20
      no_commit: -0.30
    clamp: [-0.5, 1.3]

# ---------------------------------------------------------------------------
# Final paired evaluation. The primary training claim is TP - BP.
# `tasks` is the frozen eval_core size from configs/agentic_preregister.json
# (1,200 held-out specs, 100 per cell over 12 cells).
#
# R0/RP are ABSENT BY DESIGN: no GRPO checkpoint exists (grpo.stage_disposition).
# Listing them as planned arms and then silently failing to generate them would
# read as missing data rather than as a registered decision, so they are named
# here in their own key and never scheduled.
#
# `manifests` is the MANDATORY census, 7,800 episodes, and it is the work table
# the chain's eval stage iterates -- so a registered manifest can no longer be
# preregistered and then never invoked:
#   core   1,200 x {clean, faulted} x {BP, TP}          = 4,800
#   mt       600 x clean            x {BP, TP}          = 1,200
#   h8       200 ADDITIONAL tasks   x {BP, TP}          =   400
#            (the other 200 of the registered 400 H8 instances are already in
#             core; adding faulted controls here would be a NEW preregistration)
#   absent   600 x clean, redacted  x {BP, TP}          = 1,200
#   perm     100 x clean, permuted  x {BP, TP}          =   200
# Mandatory samples may never shrink. The descriptive B0/T0 arms and the stress
# set are OPTIONAL (cut ranks 3 and 4) and are scheduled only after every
# mandatory unit is complete, so a budget stop can never eat mandatory episodes.
# ---------------------------------------------------------------------------
eval:
  tasks: 1200
  mandatory_arms: [BP, TP]
  descriptive_arms: [B0, T0]
  absent_by_design_arms: [R0, RP]
  mandatory_episodes: 7800
  manifests:
    - {name: core,   specs: eval.jsonl,        conditions: [clean, faulted], control: none,     tasks: 1200, mandatory: true}
    - {name: mt,     specs: eval_mt.jsonl,     conditions: [clean],          control: none,     tasks: 600,  mandatory: true}
    - {name: h8,     specs: eval_h8.jsonl,     conditions: [clean],          control: none,     tasks: 200,  mandatory: true}
    - {name: absent, specs: eval_absent.jsonl, conditions: [clean],          control: redacted, tasks: 600,  mandatory: true}
    - {name: perm,   specs: eval_perm.jsonl,   conditions: [clean],          control: permuted, tasks: 100,  mandatory: true}
    - {name: stress, specs: eval_stress.jsonl, conditions: [stress],         control: none,     tasks: 280,  mandatory: false}
