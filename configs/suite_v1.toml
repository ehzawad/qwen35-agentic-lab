# Suite v1 generation: TWO PHASES, TWO SEED SOURCES.
#
# The four TRAIN/DEV seeds below are public and committed, because prompt
# selection, distillation and training must be able to generate those splits
# before anything is locked. They are frozen at P, the commit that adds
# configs/preregistration_final.json.
#
# THE SIX HELD-OUT SEEDS ARE NOT IN THIS FILE, and the loader refuses a file that
# carries them. They derive from L -- the dedicated commit that adds the complete
# results/agentic/locks.json -- through the frozen derivation registered under
# [heldout] below. So the held-out realization cannot be generated until the
# prompt winner and the exact checkpoint digest are already published, which is
# the whole of D3. There is no --seed flag, no environment seed and no fallback.
#
# What this does NOT claim: a git commit id is author-influenceable, so L is not
# a randomness beacon. See docs/AGENTIC_PROTOCOL.md S18 POST-LOCK HELDOUT for the
# exact list of what a reader may and may not conclude.
#
# After the P commit these values are FROZEN: a genuinely broken gate gets a
# dated AMENDMENT plus a fresh derivation label, never an in-place edit.

suite = "agentlab-suite-v1"
generation_protocol = 2

# ---------------------------------------------------------------------------
# phase roles
# ---------------------------------------------------------------------------
[phases]
train_dev = ["oracle_sft", "distill", "grpo_train", "dev"]
heldout = ["eval", "eval_stress", "eval_mt", "eval_h8", "eval_absent", "eval_perm"]

# ---------------------------------------------------------------------------
# the public seeds: train/dev only
# ---------------------------------------------------------------------------
[seeds.train_dev]
oracle_sft = 0xA61E0001
distill = 0xA61E0002
grpo_train = 0xA61E0003
dev = 0xA61E0004

# ---------------------------------------------------------------------------
# the held-out derivation (a RULE, not a value)
# ---------------------------------------------------------------------------
# master        = SHA256("\0".join(master_label_parts) + "\0" || bytes.fromhex(L))
# split_seed(s) = int(SHA256(split_label + "\0" || master || "\0" || s), "big")
# release_id    = SHA256(release_label + "\0" || master)
#
# Six independent 256-bit split seeds and one 256-bit release id, all pure
# functions of L. agentlab.suite.generate implements exactly these labels and
# refuses to load this file if they disagree, in either direction.
[heldout]
derivation = "heldout-master-v2"
master_label_parts = ["qwen35-agentic-lab", "agentlab-suite-v1", "heldout-master-v2"]
split_label = "agentlab-heldout-split-v2"
release_label = "agentlab-heldout-release-v2"
splits = ["eval", "eval_stress", "eval_mt", "eval_h8", "eval_absent", "eval_perm"]
generation_protocol = 2
seed_source = "L: the dedicated commit that adds the complete results/agentic/locks.json"
retired_derivation = "heldout-v1, anchored on the preregistration commit -- retired because that commit exists before any lock, so every held-out answer was derivable before the prompt winner and the checkpoint were frozen"
no_fallback = true

# ---------------------------------------------------------------------------
# per-cell sizes (the registered PLAN; sizes are not seeds and stay public)
# ---------------------------------------------------------------------------
# The first six splits run over the 12 primary family/horizon cells
# (lookup_chain/typed_relay at H 2/4/8/12; fulfillment at H 4/8/14/20);
# eval_stress runs over the 7 cells at or above H8.
#
# Registered EXACT totals (not minimums):
#   oracle_sft   4,800   400 x 12 cells        [train/dev phase, pinned at P]
#   distill      2,400   200 x 12 cells        [train/dev phase, pinned at P]
#   grpo_train   2,400   200 x 12 cells        [train/dev phase, pinned at P]
#   dev          3,600   300 x 12 cells        [train/dev phase, pinned at P]
#                                              -- 300 is what the prompt
#                                              tournament needs in its NARROWEST
#                                              claim axis (the single typed_relay
#                                              H4 cell: 100 round-one + 200
#                                              round-two)
#   eval         1,200   100 x 12 cells        [held-out phase, pinned at R]
#   eval_stress    280    40 x  7 cells        [held-out phase, pinned at R]
#   eval_mt        600   100 x  6 order patterns
#   eval_h8        200   100 x  2 families (with core eval's 200 -> 400 pairs)
#   eval_absent    600   200 x  3 families, per arm
#   eval_perm      100    50 x  2 families, one deterministic derangement
#
# The held-out numbers are the registered PLAN and are committed at P; their
# realized bytes, hashes and cluster census are committed at R.
[sizes]
oracle_sft = 400
distill = 200
grpo_train = 200
dev = 300
eval = 100
eval_stress = 40
eval_mt = 100
eval_h8 = 100
eval_absent = 200
eval_perm = 50

[layout]
out_dir = "data/suite/v1"
