[project]
name = "qwen35-agentic-lab"
version = "0.1.0"
description = "Post-training path for a small agentic model: SFT, reward modelling, DPO, GRPO with real tool execution, eval and serving."
requires-python = ">=3.10,<3.15"
dependencies = [
    "vllm==0.25.1",       # pins torch==2.11.0; TRL supports vllm 0.17.0-0.25.1
    "trl==1.9.2",
    "transformers>=5.5.3",
    "peft>=0.20.0",
    "accelerate>=1.14.0",
    "datasets>=4.7.0",    # needs the Json() feature type for the `tools` column
    "math-verify",
    "bitsandbytes",
    "Pillow",
    "num2words",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
